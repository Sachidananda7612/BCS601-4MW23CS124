<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Fibonacci Generator</h1>

    <form method="POST">
        <input name="num" placeholder="Enter number" required>
        <br>
        <button type="submit">Generate</button>
    </form>

    <div class="result">
        {{ result }}
    </div>
</div>

</body>
</html>
